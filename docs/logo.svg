<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="94" fill="none" stroke="rgba(167,139,250,0.15)" stroke-width="2"/>

  <!-- Speaker icon -->
  <g transform="translate(256,200)" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="-80,-60 -40,-20 -80,-20 -80,60 -40,20 -80,60"/>
    <path d="M-20,-30a50 50 0 0 1 0 60"/>
    <path d="M30,-60a90 90 0 0 1 0 120"/>
  </g>

  <!-- Subtle glow behind icon -->
  <circle cx="256" cy="200" r="100" fill="rgba(167,139,250,0.04)"/>

  <!-- Text -->
  <text x="256" y="400" text-anchor="middle" font-family="'Nimbus Mono PS',Courier,monospace" font-size="48" font-weight="700" fill="url(#accent)" letter-spacing="4">zenTTS</text>
</svg>
