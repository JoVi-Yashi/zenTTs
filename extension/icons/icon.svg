<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- zenTTS — illuminated capital Z (manuscript initial) with sound waves -->
  <defs>
    <pattern id="diaper" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16 3 L29 16 L16 29 L3 16 Z" fill="none" stroke="#5e1a0e" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.2" fill="#a8452c"/>
    </pattern>
    <g id="vine" fill="none" stroke="#f1dfb8" stroke-linecap="round">
      <path stroke-width="6" d="M142 318 C 132 272, 156 226, 206 206 C 238 194, 262 206, 258 228 C 254 248, 230 250, 222 236"/>
      <g fill="#f1dfb8" stroke="none">
        <path d="M150 272 c -26 -6 -40 -28 -34 -46 c 22 6 36 26 34 46 z"/>
        <path d="M176 226 c -4 -26 12 -46 32 -48 c 2 22 -12 42 -32 48 z"/>
        <path d="M232 204 c 10 -20 32 -26 46 -16 c -12 16 -30 22 -46 16 z"/>
        <circle cx="221" cy="235" r="7"/>
      </g>
    </g>
  </defs>

  <!-- Gold frame -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="#c9973a"/>
  <rect x="22" y="22" width="468" height="468" rx="76" fill="#2a160c"/>
  <rect x="30" y="30" width="452" height="452" rx="70" fill="#e8c46a"/>

  <!-- Oxblood field with a faint diaper pattern -->
  <rect x="44" y="44" width="424" height="424" rx="58" fill="#7c2716"/>
  <rect x="44" y="44" width="424" height="424" rx="58" fill="url(#diaper)" opacity="0.5"/>

  <!-- Vines in the two open triangles -->
  <use href="#vine"/>
  <use href="#vine" transform="rotate(180 256 256)"/>

  <!-- The Z: thin bars, heavy diagonal, teardrop swashes -->
  <g fill="#e3b04b" stroke="#2a160c" stroke-width="7" stroke-linejoin="round">
    <path d="M112 116 L400 116 L400 156 L214 356 L400 356 L400 396 L112 396 L112 356 L298 156 L112 156 Z"/>
    <path d="M112 156 C 100 176, 106 194, 124 200 C 132 186, 130 170, 124 156 Z"/>
    <path d="M400 356 C 412 336, 406 318, 388 312 C 380 326, 382 342, 388 356 Z"/>
    <path d="M190 256 L206 246 L306 246 L322 256 L306 266 L206 266 Z"/>
  </g>
  <!-- Gilded highlights -->
  <g stroke="#f8e0a0" stroke-width="5" stroke-linecap="round">
    <path d="M124 127 L390 127"/>
    <path d="M124 367 L390 367"/>
  </g>

  <!-- Sound waves leaving the corner -->
  <g fill="none" stroke="#f1dfb8" stroke-width="11" stroke-linecap="round">
    <path d="M420 84 a 30 30 0 0 1 0 40"/>
    <path d="M438 66 a 56 56 0 0 1 0 76"/>
  </g>
</svg>
