<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zenTTS · Biblioteca</title>
<link rel="icon" href="icons/icon-32.png">
<style>
  :root {
    --paper: #efe9dc; --sheet: #fbf8f1; --ink: #2a2622; --ink-soft: #6d655a; --rule: #ddd4c3; --accent: #9a3b25;
    --serif: "Iowan Old Style", "Charter", "Source Serif 4", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* Shelf wood (oak by default; see [data-wood]) */
    --wood-1: #c99e6e; --wood-2: #a87b4f; --wood-3: #7a5533; --back-1: #5e4028; --back-2: #3f2a19;
    --h: 210px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141210; --sheet: #211e1a; --ink: #ece4d6; --ink-soft: #a39a8b; --rule: #3a352e; --accent: #d9785c; }
  }
  [data-wood="walnut"] { --wood-1: #7d5638; --wood-2: #5f3f27; --wood-3: #3d2817; --back-1: #3a2616; --back-2: #24170d; }
  [data-wood="dark"] { --wood-1: #4a3f38; --wood-2: #352c26; --wood-3: #221c18; --back-1: #221d1a; --back-2: #141110; }
  [data-wood="minimal"] { --wood-1: var(--rule); --wood-2: var(--rule); --wood-3: var(--rule); --back-1: transparent; --back-2: transparent; }
  [data-size="s"] { --h: 170px; } [data-size="l"] { --h: 250px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  .btn {
    padding: 6px 13px; border-radius: 5px; border: 1px solid var(--ink); background: transparent; cursor: pointer;
    transition: background-color .15s ease, transform .08s ease;
  }
  .btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .btn:active { transform: scale(.97); }
  .btn.main { background: var(--ink); color: var(--sheet); }
  .btn.main:hover { opacity: .9; }
  .btn.ghost { border-color: transparent; }
  .btn.ghost:hover { border-color: var(--rule); }
  .btn.danger { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Top ---- */
  .top { display: flex; align-items: center; gap: 14px; padding: 16px 28px 6px; max-width: 1240px; margin: 0 auto; }
  .logo { font: 600 21px var(--serif); text-decoration: none; color: var(--ink); white-space: nowrap; }
  .logo em { font-style: italic; font-weight: 400; color: var(--accent); }
  .logo span { font-weight: 400; color: var(--ink-soft); font-size: 17px; }
  .spacer { flex: 1; }
  #search {
    width: min(260px, 40vw); padding: 7px 12px; border-radius: 20px; border: 1px solid var(--rule); background: var(--sheet);
    outline: none;
  }
  #search:focus { border-color: var(--ink-soft); }

  /* ---- Tag tabs (sub-libraries) ---- */
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: 1240px; margin: 8px auto 0; padding: 0 28px; }
  .tab {
    position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 16px;
    border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; white-space: nowrap;
    transition: border-color .15s ease, background-color .15s ease, transform .15s ease;
  }
  .tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
  .tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-soft)); }
  .tab .count { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
  .tab .x { display: none; margin-left: 2px; border: none; background: none; cursor: pointer; opacity: .7; padding: 0 2px; }
  .tab:hover .x, .tab:focus-within .x { display: inline; }
  .tab.drop { transform: scale(1.08); border-color: var(--accent); }
  .tab input { width: 120px; border: none; background: transparent; outline: none; }
  .tab.new { border-style: dashed; color: var(--ink-soft); }

  /* ---- Stage: the bookcase, centered ---- */
  #stage {
    max-width: 1240px; margin: 18px auto 60px; padding: 0 28px;
    transition: filter .45s ease, transform .55s cubic-bezier(.2,.8,.2,1), opacity .45s ease;
    transform-origin: 30% 50%;
  }
  body.focused #stage { filter: blur(7px) saturate(.8); transform: translateX(-16%) scale(.9); opacity: .55; pointer-events: none; }
  .case {
    position: relative; padding: 24px 22px 8px; border-radius: 6px;
    background: linear-gradient(180deg, var(--back-1), var(--back-2));
    box-shadow: inset 0 0 0 12px var(--wood-2), inset 0 0 0 13px rgba(0,0,0,.25), inset 0 18px 40px rgba(0,0,0,.35), 0 20px 50px rgba(0,0,0,.18);
  }
  [data-wood="minimal"] .case { box-shadow: none; padding: 10px 0 0; }
  .group-label {
    display: inline-block; margin: 6px 0 0 18px; padding: 2px 12px; border-radius: 3px;
    background: linear-gradient(180deg, #e3c27a, #b8872e); color: #2b1d12; font: 600 12px var(--serif); letter-spacing: .04em;
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  [data-wood="minimal"] .group-label { background: none; box-shadow: none; color: var(--ink-soft); padding: 0; margin-left: 4px; }
  .row { position: relative; display: flex; align-items: flex-end; gap: 3px; padding: 0 18px; min-height: calc(var(--h) + 20px); perspective: 1400px; }
  .plank {
    height: 20px; margin: 0 -2px 22px; border-radius: 2px;
    background: linear-gradient(180deg, var(--wood-1) 0, var(--wood-2) 55%, var(--wood-3) 100%);
    box-shadow: 0 10px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
  }
  [data-wood="minimal"] .plank { height: 2px; box-shadow: none; margin-bottom: 26px; }
  .empty { padding: 40px 20px 30px; text-align: center; color: #efe3c6; font: italic 17px var(--serif); }
  [data-wood="minimal"] .empty { color: var(--ink-soft); }
  .empty .btn { margin-top: 12px; font-style: normal; border-color: currentColor; }

  /* ---- A book: a 3D box, standing with its spine to you ---- */
  .book {
    --d: 30px; --w: calc(var(--h) * .7); --turn: -78deg;
    position: relative; flex: none; width: var(--d); height: var(--h); margin: 0; padding: 0;
    border: none; background: none; cursor: pointer; transform-style: preserve-3d;
    transition: margin .35s cubic-bezier(.2,.8,.2,1);
    animation: arrive .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--delay, 0s);
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: none; } }
  .book:focus-visible { outline: none; }
  .b3 {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transform: translateZ(calc(var(--w) / -2));
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .face { position: absolute; top: 0; left: 50%; height: var(--h); backface-visibility: hidden; overflow: hidden; }
  .spine {
    width: var(--d); margin-left: calc(var(--d) / -2); transform: translateZ(calc(var(--w) / 2));
    background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.14) 28%, rgba(0,0,0,.05) 60%, rgba(0,0,0,.3)), var(--spine, #6b4a32);
    color: #f6ecd8; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 0;
    border-radius: 2px 2px 1px 1px;
  }
  .spine::before, .spine::after { content: ""; width: 70%; height: 2px; background: rgba(233, 196, 106, .75); box-shadow: 0 4px 0 rgba(233, 196, 106, .45); }
  .spine .t {
    flex: 1; min-height: 0; overflow: hidden; writing-mode: vertical-rl; text-orientation: mixed;
    font: 600 12px/1.1 var(--serif); letter-spacing: .03em; text-shadow: 0 1px 1px rgba(0,0,0,.4);
    padding: 8px 0; white-space: nowrap; text-overflow: ellipsis; max-height: 100%;
  }
  .front, .back {
    width: var(--w); margin-left: calc(var(--w) / -2); background: var(--spine, #6b4a32);
    box-shadow: inset 4px 0 8px rgba(0,0,0,.25);
  }
  .front { transform: rotateY(90deg) translateZ(calc(var(--d) / 2)); border-radius: 1px 3px 3px 1px; }
  .back { transform: rotateY(-90deg) translateZ(calc(var(--d) / 2)); border-radius: 3px 1px 1px 3px; }
  .front img, .back img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .front::after, .back::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.22), transparent 8%, transparent 92%, rgba(255,255,255,.12)); pointer-events: none; }
  .plain {
    position: absolute; inset: 10px; border: 1.5px solid rgba(233, 196, 106, .7); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 10px; text-align: center; color: #f6ecd8;
  }
  .plain b { font: 600 15px/1.2 var(--serif); }
  .plain i { font: italic 12px var(--serif); opacity: .85; }
  .edge {
    width: var(--d); margin-left: calc(var(--d) / -2); transform: rotateY(180deg) translateZ(calc(var(--w) / 2));
    background: repeating-linear-gradient(90deg, #f3ecdc 0 1px, #e2d6bd 1px 2px);
  }

  /* Hover / focus: the book comes out and turns its cover to you, towards the nearest side */
  .book:hover, .book:focus-visible { margin: 0 calc(var(--w) * .42); z-index: 2; }
  .book:hover .b3, .book:focus-visible .b3 { transform: translateZ(calc(var(--w) / -2 + 70px)) translateY(-10px) rotateY(var(--turn)); }
  .book:focus-visible .spine { box-shadow: 0 0 0 2px var(--accent); }
  .book.dragging { opacity: .4; }
  /* A brass bookend closing each row */
  .bookend {
    flex: none; width: 10px; height: calc(var(--h) * .55); margin-left: 4px; border-radius: 2px 2px 0 0;
    background: linear-gradient(90deg, #8a6420, #e3c27a 40%, #b8872e 70%, #6e4f18);
    box-shadow: 2px 0 6px rgba(0,0,0,.35); animation: arrive .6s cubic-bezier(.2,.8,.2,1) both;
  }
  [data-wood="minimal"] .bookend { background: var(--ink-soft); box-shadow: none; width: 4px; }
  .progress-tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.25); }
  .progress-tick i { display: block; height: 100%; background: #e9c46a; }

  /* ---- Focus: the chosen book in the middle, turning ---- */
  #focus {
    position: fixed; inset: 0; z-index: 20; display: grid; grid-template-columns: 1fr minmax(300px, 380px);
    align-items: center; gap: 30px; padding: 40px 6vw; background: color-mix(in srgb, var(--paper) 35%, transparent);
    opacity: 0; transition: opacity .35s ease;
  }
  #focus.show { opacity: 1; }
  #focus .holder { display: flex; justify-content: center; align-items: center; perspective: 1600px; height: 100%; min-height: 0; }
  #focus .book { --h: min(64vh, 470px); --d: calc(var(--thick, 30px) * 2); animation: none; cursor: grab; pointer-events: auto; }
  #focus .book:active { cursor: grabbing; }
  #focus .book:hover { margin: 0; }
  #focus .b3 { transition: none; transform: rotateY(var(--spin, -90deg)); }
  #focus .b3.fly { transition: transform .7s cubic-bezier(.2,.8,.2,1); }
  #focus .shadow { position: absolute; bottom: -38px; left: 50%; width: calc(var(--w) * 1.1); height: 26px; margin-left: calc(var(--w) * -.55); border-radius: 50%; background: radial-gradient(rgba(0,0,0,.35), transparent 70%); transform: none; }
  .card {
    position: relative;
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
    display: flex; flex-direction: column; gap: 12px; max-height: 88vh; overflow: auto;
    transform: translateX(30px); opacity: 0; transition: transform .45s cubic-bezier(.2,.8,.2,1) .1s, opacity .35s ease .1s;
  }
  #focus.show .card { transform: none; opacity: 1; }
  .card .title { font: 600 22px/1.25 var(--serif); border: none; background: none; width: 100%; padding: 2px 0; border-bottom: 1px dashed transparent; outline: none; }
  .card .author { font: italic 15px var(--serif); color: var(--ink-soft); border: none; background: none; width: 100%; padding: 2px 0; border-bottom: 1px dashed transparent; outline: none; }
  .card .title:hover, .card .author:hover, .card .title:focus, .card .author:focus { border-bottom-color: var(--rule); }
  .meter { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .card .muted { color: var(--ink-soft); font-size: 13px; }
  .card .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card .chip { padding: 3px 10px; border-radius: 12px; border: 1px solid var(--rule); background: none; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .card .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .card .chip[aria-pressed="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .card h3 { margin: 6px 0 0; font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .close { position: absolute; top: 12px; right: 12px; font-size: 16px; }
  .card .title { padding-right: 36px; }
  input[type="color"] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--rule); border-radius: 4px; background: none; cursor: pointer; }

  /* ---- Settings ---- */
  #settings {
    position: fixed; z-index: 30; top: 58px; right: max(28px, calc(50vw - 592px)); width: 290px; padding: 16px;
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.2);
    display: flex; flex-direction: column; gap: 12px; animation: pop .2s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #settings select { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--rule); background: var(--paper); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; background: none; padding: 3px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
  #settings .muted { color: var(--ink-soft); font-size: 12px; }

  [hidden] { display: none !important; }
  @media (max-width: 820px) {
    .top { flex-wrap: wrap; padding: 12px 16px 4px; } #search { order: 5; width: 100%; }
    #tabs, #stage { padding: 0 16px; }
    #focus { grid-template-columns: 1fr; grid-template-rows: 1fr auto; padding: 20px 16px; overflow: auto; }
    #focus .book { --h: 40vh; }
    body.focused #stage { transform: scale(.94); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body data-wood="oak" data-size="m">
  <header class="top">
    <a class="logo" href="library.html">zen<em>TTS</em> <span id="lib-title">· Biblioteca</span></a>
    <span class="spacer"></span>
    <input id="search" type="search" autocomplete="off">
    <button type="button" class="btn main" id="open-pdf"></button>
    <button type="button" class="btn ghost" id="settings-btn" aria-haspopup="dialog">⚙</button>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="stage"></main>

  <section id="focus" hidden role="dialog" aria-modal="true">
    <div class="holder" id="focus-holder"></div>
    <div class="card" id="card"></div>
  </section>

  <div id="settings" hidden role="dialog"></div>
  <input type="file" id="img-input" accept="image/*" hidden>

  <script type="module" src="library.js"></script>
</body>
</html>
