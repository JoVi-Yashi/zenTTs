  <path d="M36 58v12" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M52 42v44" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M28 64v0" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.2"/>
